<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truthify - Hero Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* Évite les scrollbars dues à l'inclinaison */
        }
        
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Animation de flottement pour l'ensemble du conteneur */
        @keyframes float {
            0% { transform: translateY(0px) rotate(-3deg); }
            50% { transform: translateY(-10px) rotate(-3deg); }
            100% { transform: translateY(0px) rotate(-3deg); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>
<body>

<!-- Ajout de l'inclinaison initiale (-rotate-3), de l'animation de flottement et d'une ombre plus diffuse -->
<div class="bg-white rounded-3xl shadow-[0_20px_50px_rgb(0,0,0,0.12)] border border-slate-100 w-full max-w-[400px] mx-4 overflow-hidden relative transform -rotate-3 hover:-rotate-2 transition-transform duration-500 animate-float">
    
    <!-- Effet de reflet en haut -->
    <div class="absolute top-0 inset-x-0 h-px bg-gradient-to-r from-transparent via-white/50 to-transparent z-10"></div>

    <div class="flex items-center justify-center px-4 py-2.5 border-b border-slate-100 bg-slate-50/50 relative">
        <div class="absolute left-4 flex gap-1.5">
            <div class="w-2.5 h-2.5 rounded-full bg-slate-200"></div>
            <div class="w-2.5 h-2.5 rounded-full bg-slate-200"></div>
            <div class="w-2.5 h-2.5 rounded-full bg-slate-200"></div>
        </div>
        <!-- Nom sans icône -->
        <div class="opacity-60">
            <span class="text-xs font-semibold text-slate-500 tracking-wide">Truthify</span>
        </div>
    </div>

    <div class="p-4 pb-2 space-y-3">
        
        <div class="bg-slate-50 rounded-2xl p-3.5 border border-slate-100">
            <div class="flex items-center gap-2 mb-2 text-slate-500">
                <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
                <span class="text-xs font-medium">Texte analysé</span>
            </div>
            
            <div class="space-y-2.5 mt-1">
                <div class="h-3 bg-slate-200 rounded-md w-full"></div>
                <div class="h-3 bg-orange-100 rounded-md w-[80%] border border-orange-200 border-dashed"></div>
            </div>
        </div>

        <div class="flex justify-center -my-1 relative z-10">
            <div class="bg-white border border-slate-100 shadow-sm rounded-full p-1.5 text-slate-400 animate-pulse-subtle">
                <i data-lucide="arrow-down" class="w-4 h-4"></i>
            </div>
        </div>

        <div class="bg-white rounded-2xl p-3.5 border-l-[4px] border-l-red-500 border border-t-slate-200 border-r-slate-200 border-b-slate-200 shadow-sm relative overflow-hidden">
            
            <div class="absolute inset-0 bg-red-50 opacity-30 pointer-events-none"></div>

            <div class="relative z-10">
                <!-- En-tête de la carte avec icône et note -->
                <div class="flex items-start justify-between mb-2">
                    <div class="flex items-center gap-1.5 mt-1">
                        <!-- Remplacement de l'icône brain-circuit par activity pour plus de lisibilité -->
                        <i data-lucide="activity" class="w-3.5 h-3.5 text-slate-400"></i>
                        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Résultat</span>
                    </div>
                    
                    <div class="flex items-baseline gap-0.5 text-red-600 font-bold bg-white rounded-md px-2 py-1 shadow-sm border border-red-100">
                        <span class="text-2xl leading-none">4</span>
                        <span class="text-xs text-slate-400 leading-none font-semibold">/10</span>
                    </div>
                </div>

                <div class="flex flex-wrap items-center gap-2 mb-2">
                    <div class="flex items-center gap-1.5 text-red-600 font-semibold">
                        <i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i>
                        <span class="text-xs">Biais cognitif</span>
                    </div>
                    <!-- Séparateur -->
                    <span class="text-slate-300 text-xs">•</span>
                    <!-- Tag intégré à la ligne -->
                    <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[9px] font-bold uppercase tracking-wide bg-red-100 text-red-700">
                        Généralisation hâtive
                    </span>
                </div>

                <!-- Skeleton Explication (réduit à 1 ligne pour gagner de la place) -->
                <div class="space-y-2 mt-2">
                    <div class="h-2.5 bg-slate-100 rounded w-[90%]"></div>
                </div>
            </div>
        </div>
        
    </div>
    
    <div class="h-3"></div>

</div>

<script>
    lucide.createIcons();
</script>

</body>
</html>
