<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggst - Illustration simplifiée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', 'Helvetica', 'sans-serif'],
                    },
                    boxShadow: {
                        'app': '0 20px 40px -10px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(0,0,0,0.05)',
                        'floating': '0 10px 30px -5px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0,0,0,0.03)',
                        'icon': '0 8px 20px -4px rgba(0, 0, 0, 0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            /* Fond neutre pour simuler la page web hôte */
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
        }
        
        /* Conteneur de l'illustration pour simuler la taille dans une carte */
        .illustration-container {
            /* Taille de base, mais s'adapte en responsif */
            width: 100%;
            max-width: 640px;
            aspect-ratio: 16 / 11;
            transform-origin: center;
            /* Animation d'entrée douce */
            animation: float-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes float-in {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

    <div class="illustration-container">
        <!-- Cadre de l'application MacOS -->
        <div class="w-full h-full bg-white rounded-[1.5rem] shadow-app overflow-hidden flex flex-col relative border border-gray-100">
            
            <div class="flex-1 flex h-full">
                
                <!-- Sidebar (Zone Grise) -->
                <div class="w-[30%] bg-[#f8f9fa] border-r border-gray-100 flex flex-col pt-4 pb-5 px-3">
                    
                    <!-- Boutons fenêtre Mac -->
                    <div class="flex gap-1.5 px-2 mb-6">
                        <div class="w-2.5 h-2.5 rounded-full bg-red-400"></div>
                        <div class="w-2.5 h-2.5 rounded-full bg-amber-400"></div>
                        <div class="w-2.5 h-2.5 rounded-full bg-green-400"></div>
                    </div>

                    <!-- En-tête Sidebar (App Icon) -->
                    <div class="flex items-center gap-2.5 px-2 mb-6">
                        <div class="w-7 h-7 rounded-lg bg-blue-500 flex items-center justify-center text-white shadow-sm">
                            <i class="ph-bold ph-waveform text-sm"></i>
                        </div>
                        <div class="font-bold text-gray-900 text-sm tracking-tight">Suggst</div>
                    </div>

                    <!-- Menu Actif -->
                    <div class="bg-gray-200/60 rounded-xl px-3 py-2 flex items-center gap-2.5 mb-2">
                        <i class="ph-fill ph-microphone-stage text-blue-500 text-sm"></i>
                        <span class="text-xs font-semibold text-gray-900">En direct</span>
                    </div>

                    <!-- Menus Inactifs (Squelettes) -->
                    <div class="space-y-1 mt-1">
                        <!-- Ligne 1 -->
                        <div class="px-3 py-2 flex items-center gap-2.5">
                            <i class="ph-fill ph-user-focus text-gray-400 text-sm"></i>
                            <div class="h-2 w-16 bg-gray-200 rounded-full"></div>
                        </div>
                        <!-- Ligne 2 -->
                        <div class="px-3 py-2 flex items-center gap-2.5">
                            <i class="ph-fill ph-briefcase text-gray-400 text-sm"></i>
                            <div class="h-2 w-20 bg-gray-200 rounded-full"></div>
                        </div>
                        <div class="h-4"></div> <!-- Spacer -->
                        <!-- Ligne 3 -->
                        <div class="px-3 py-2 flex items-center gap-2.5">
                            <i class="ph-fill ph-cpu text-gray-400 text-sm"></i>
                            <div class="h-2 w-24 bg-gray-200 rounded-full"></div>
                        </div>
                        <!-- Ligne 4 -->
                        <div class="px-3 py-2 flex items-center gap-2.5">
                            <i class="ph-fill ph-faders text-gray-400 text-sm"></i>
                            <div class="h-2 w-12 bg-gray-200 rounded-full"></div>
                        </div>
                    </div>

                    <div class="flex-1"></div>

                    <!-- Statut Bottom Sidebar -->
                    <div class="px-3 flex items-center gap-2">
                        <div class="w-1.5 h-1.5 rounded-full bg-green-500"></div>
                        <div class="h-1.5 w-16 bg-gray-200 rounded-full"></div>
                    </div>
                </div>

                <div class="flex-1 bg-white relative flex flex-col items-center justify-center p-6">
                    
                    <!-- Icône top right (Toggle Sidebar simulé) -->
                    <div class="absolute top-4 right-4 text-gray-300">
                        <i class="ph-bold ph-sidebar-simple text-lg"></i>
                    </div>

                    <!-- Contenu Central Abstrait -->
                    <div class="flex flex-col items-center transform -translate-y-6">
                        
                        <!-- Cercle Micro Géant -->
                        <div class="w-20 h-20 bg-white rounded-full shadow-icon flex items-center justify-center mb-5 border border-gray-50/50">
                            <i class="ph-fill ph-microphone text-3xl text-blue-500"></i>
                        </div>

                        <!-- Titre Principal -->
                        <div class="text-xl font-bold text-gray-900 mb-3 tracking-tight">Suggst est prêt.</div>
                        
                        <!-- Sous-titre Squelette (2 lignes) -->
                        <div class="flex flex-col items-center gap-1.5">
                            <div class="h-2 w-48 bg-gray-100 rounded-full"></div>
                            <div class="h-2 w-32 bg-gray-100 rounded-full"></div>
                        </div>

                    </div>

                    <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 w-[85%] max-w-[320px]">
                        <div class="bg-[#f8f9fa] rounded-full p-1.5 flex items-center shadow-floating border border-gray-200/60 backdrop-blur-sm">
                            
                            <!-- Icônes de statut technique abstraites -->
                            <div class="flex items-center px-4 gap-4 flex-1">
                                <div class="flex flex-col items-center gap-1">
                                    <i class="ph-fill ph-speaker-hifi text-gray-400 text-sm"></i>
                                    <div class="w-1 h-1 bg-gray-300 rounded-full"></div>
                                </div>
                                <div class="flex flex-col items-center gap-1">
                                    <i class="ph-fill ph-microphone text-gray-400 text-sm"></i>
                                    <div class="w-1 h-1 bg-gray-300 rounded-full"></div>
                                </div>
                                <div class="w-[1px] h-4 bg-gray-200 mx-1"></div>
                                <div class="flex flex-col items-center gap-1">
                                    <i class="ph-fill ph-gear text-gray-400 text-sm"></i>
                                    <div class="w-1 h-1 bg-green-500 rounded-full"></div>
                                </div>
                            </div>

                            <!-- Bouton Principal -->
                            <div class="bg-[#1a1a1a] text-white rounded-full px-5 py-2.5 flex items-center gap-1.5 shadow-md">
                                <i class="ph-fill ph-play text-xs"></i>
                                <span class="text-xs font-semibold tracking-wide">Démarrer</span>
                            </div>
                            
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
