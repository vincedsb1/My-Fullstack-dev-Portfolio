name: Quality
on: [push, pull_request]
jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run blog:test:json
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run blog:test:seo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run blog:test:publication
      - run: npm run blog:test:preview
      - run: npm run audit:verify
      - name: Archiver les références visuelles du blog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-visual-reference-${{ github.sha }}
          path: |
            tests/visual-artifacts/*.png
            tests/visual-artifacts/*.pdf
          if-no-files-found: warn
          retention-days: 30
